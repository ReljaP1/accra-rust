[project]
name = "accra-rust"
version = "0.1.0"
description = "Add your description here"
readme = "README.txt"
authors = [
    { name = "Rumen Mitov", email = "rumenmitov@disroot.org" }
]
requires-python = ">=3.12"
dependencies = [
    "accra-language",
]

[project.scripts]
accra-rust = "accra_rust:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
accra-language = { git = "https://github.com/rumenmitov/accra-language" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
